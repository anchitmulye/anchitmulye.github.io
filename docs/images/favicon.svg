<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1626"/>
      <stop offset="100%" style="stop-color:#060608"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Subtle top edge highlight -->
  <rect width="64" height="1.5" rx="1" fill="#4488FF" opacity="0.25"/>

  <!-- Brackets -->
  <text x="5" y="43" font-family="'SF Mono','JetBrains Mono','Courier New',monospace"
        font-size="28" font-weight="700" fill="#4488FF" opacity="0.85">[</text>
  <text x="50" y="43" font-family="'SF Mono','JetBrains Mono','Courier New',monospace"
        font-size="28" font-weight="700" fill="#4488FF" opacity="0.85">]</text>

  <!-- Initials -->
  <text x="32" y="43" font-family="'SF Mono','JetBrains Mono','Courier New',monospace"
        font-size="20" font-weight="700" fill="#E8EEF8"
        text-anchor="middle" letter-spacing="-0.0">AM</text>
</svg>